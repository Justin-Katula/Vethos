appId: com.nexus.blocking
productName: Vethos
directories:
  output: release
  buildResources: build
icon: build/icon.ico

files:
  - 'out/**/*'
  - 'package.json'
  - '!**/.vscode/*'
  - '!**/{.DS_Store,.git,.gitkeep,.gitignore,.npmrc,.eslintrc.cjs,.prettierrc}'
  - '!**/{README.md,docs}'

asar: true

# `Informations/Vethos_catalogue.json` figurait ici : le dossier a ete supprime avec
# la couche de decision, et electron-builder se contentait d'avertir a chaque build
# avant de sauter la ressource. Plus aucun code ne la lit.
extraResources:
  - from: build/icon.ico
    to: icon.ico
  # MIT, ISC et OFL-1.1 exigent que leur avis accompagne le logiciel distribue.
  # Genere par `npm run generer:licences`, appele depuis `npm run build`.
  - from: build/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: false
  guid: a8e0b9da-61a1-4be1-9c1e-6ad8d7994e0f
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vethos
  installerIcon: build/installer-icon.png
  uninstallerIcon: build/installer-icon.png
  installerHeaderIcon: build/installer-icon.png

portable:
  artifactName: ${productName}-Portable-${version}.${ext}

# Ces deux lignes decident d'ou l'application telechargera ses mises a jour, et
# `autoDownload` + `autoInstallOnAppQuit` sont actifs : ce qui est publie ici est
# installe chez l'utilisateur. Elles doivent donc designer le depot que VOUS
# controlez. Elles pointaient vers `obedi/Nexus`, qui n'est pas ce depot.
publish:
  provider: github
  owner: Justin-Katula
  repo: Vethos
